# MPM tuning for OJS.
#
# The upstream default (MaxRequestWorkers 150, MaxConnectionsPerChild 0) is
# sized for a single dedicated server. With mod_php every worker is a full PHP
# process holding an OJS request in RAM, so 150 workers can reserve several
# gigabytes per container. When many OJS containers share one host, cap the
# worker count explicitly.
#
# Sizing rule (RSS per OJS worker is typically 60-90 MB):
#
#   MaxRequestWorkers <= (container_mem_limit
#                         - opcache.memory_consumption
#                         - CLI workers (queue + scheduler)
#                         - 150 MB headroom) / 80 MB
#
# Example: 1536 MB limit, 128 MB opcache, 150 MB CLI/headroom
#   (1536 - 128 - 150) / 80 = ~15  ->  APACHE_MAX_REQUEST_WORKERS=14
#
# Both values are environment driven so each deployment can tune them without
# rebuilding the image.
<IfModule mpm_prefork_module>
    StartServers             ${APACHE_START_SERVERS}
    MinSpareServers          2
    MaxSpareServers          4
    ServerLimit              ${APACHE_MAX_REQUEST_WORKERS}
    MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
    # Recycle workers periodically: PHP OJS code is not leak-free over very
    # long lifetimes, and recycling caps RSS growth without visible stalls.
    MaxConnectionsPerChild   500
</IfModule>