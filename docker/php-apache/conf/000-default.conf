<VirtualHost *:80>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    # Log to the container's stdout/stderr so `docker logs` shows Apache
    # output. Rotation is handled by the container runtime (compose sets
    # json-file max-size/max-file), not by log files written inside the
    # container.
    ErrorLog /proc/self/fd/2
    # Health checks and static assets are far too chatty to keep in the access
    # log once dozens of containers run. They are still visible in the nginx
    # log at the edge.
    SetEnvIf Request_URI "^/healthz\.txt$" dontlog
    SetEnvIf Request_URI "\.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$" dontlog
    CustomLog /proc/self/fd/1 combined env=!dontlog

    <IfModule mod_headers.c>
        Header always set X-Xss-Protection "1; mode=block"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    </IfModule>
</VirtualHost>