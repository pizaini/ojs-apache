# Optional HTTPS virtual host.
#
# This file is NOT enabled by default. It is symlinked into conf-enabled/ by the
# entrypoint when OJS_ENABLE_SSL=1, which is only needed when Apache terminates
# TLS itself. Behind nginx (or any other reverse proxy) leave it disabled and
# let the proxy terminate TLS; Apache then serves plain HTTP on port 80.
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        DocumentRoot ${APACHE_DOCUMENT_ROOT}

        SSLEngine on
        SSLCertificateFile /etc/apache2/ssl/ssl.crt
        SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
        SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
        SSLHonorCipherOrder off
        SSLSessionTickets off

        ErrorLog /proc/self/fd/2
        CustomLog /proc/self/fd/1 combined

        <IfModule mod_headers.c>
            Header always set X-Xss-Protection "1; mode=block"
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
            Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS
        </IfModule>
    </VirtualHost>
</IfModule>