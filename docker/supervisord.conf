[supervisord]
nodaemon=true
user=root
minfds=65536
minprocs=200
; In nodaemon mode supervisord already attaches a stdout handler. Pointing
; logfile at stdout as well duplicated every line (as seen in docker logs).
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/run/supervisord.pid

; All programs log to stdout with no local rotation: log rotation is delegated
; to the container runtime. Writing logs to files inside the container is a
; classic way to fill a host disk when many containers run side by side.

; ───────────────────────────────
; OJS Queue Worker
; Runs as www-data so files it creates stay writable by Apache.
;
; Wrapped in a retry loop on purpose: `jobs.php work` exits with status 0
; while OJS is not installed or is in maintenance mode. With autorestart=true
; that produced a respawn every second; the loop backs off instead and picks
; the worker up automatically once the installer finishes.
; ───────────────────────────────
[program:ojs-queue-monitor]
command=bash -c 'while true; do if [ ! -f /var/www/html/config.inc.php ]; then echo "[queue] OJS is not installed yet, retrying in 60s"; sleep 60; continue; fi; php /var/www/html/lib/pkp/tools/jobs.php work --sleep=%(ENV_OJS_QUEUE_SLEEP)s; status=$?; echo "[queue] worker exited with status ${status}, retrying in 30s"; sleep 30; done'
directory=/var/www/html
user=www-data
environment=HOME="/var/www/ojs-data"
autostart=true
autorestart=true
startretries=5
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ───────────────────────────────
; Apache Web Server
; ───────────────────────────────
[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
directory=/var/www/html
user=root
autostart=true
autorestart=true
startretries=5
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
; Must stay below docker's stop_grace_period (40s in docker-compose.yml),
; otherwise the runtime SIGKILLs Apache mid-request.
stopwaitsecs=15
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ───────────────────────────────
; OJS Scheduler
; Runs as www-data for the same reason as the queue worker.
; ───────────────────────────────
[program:ojs-scheduler]
command=bash -c 'while true; do if [ ! -f /var/www/html/config.inc.php ]; then echo "[scheduler] OJS is not installed yet, waiting"; else php /var/www/html/lib/pkp/tools/scheduler.php run || echo "[scheduler] run failed"; fi; sleep %(ENV_OJS_SCHEDULER_INTERVAL)s; done'
directory=/var/www/html
user=www-data
environment=HOME="/var/www/ojs-data"
autostart=true
autorestart=true
startretries=5
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=10
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0