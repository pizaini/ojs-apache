# Tier 1 — small instance (target: 5 containers)
#
#   OJS_PROJECT=ojs-j1 OJS_NAME=ojs-j1 OJS_PORT=8081 \
#     docker compose -f docker-compose.tier1.yml up -d
#
# Memory budget per container:
#   5 workers x 80 MB + 64 MB OPcache + queue 60 MB + scheduler 100 MB + slack
#   = ~768 MB limit / 384 MB reservation
#
# CPU: all OJS containers share cpuset 0-5 (max 6 cores for the whole fleet).
# Within that set this container may burst to 0.5 core and has share weight 256
# (half of Tier 2, a quarter of Tier 3).
#
# Sessions: OJS 3.5 keeps sessions in MariaDB, not on disk. The tmpfs below is a
# fallback for plugins that use native PHP sessions; it costs 32 MB of RAM and
# zero bytes of data volume.
name: ${OJS_PROJECT:?set OJS_PROJECT, e.g. ojs-j1}

services:
  ojs:
    image: pizaini/ojs-apache:latest
    container_name: ${OJS_NAME:?set OJS_NAME, e.g. ojs-j1}
    environment:
      OJS_SESSION_DIR: /var/lib/php/sessions
      OJS_MEMORY_LIMIT: 192M
      OJS_OPCACHE_MB: "64"
      OJS_OPCACHE_STRINGS_MB: "8"
      OJS_REALPATH_KB: "1024"
      APACHE_MAX_REQUEST_WORKERS: "5"
      APACHE_START_SERVERS: "2"
      OJS_QUEUE_SLEEP: "60"
      OJS_SCHEDULER_INTERVAL: "600"
      OJS_ENABLE_SSL: "0"
      OJS_REDIRECT_HTTPS: "0"
      OJS_TRUSTED_PROXIES: ${OJS_TRUSTED_PROXIES:-172.16.0.0/12}
    ports:
      # nginx on the host proxies to this loopback port.
      - "127.0.0.1:${OJS_PORT:?set OJS_PORT}:80"
    volumes:
      # OJS data: submissions, uploads, caches.
      - ojs-files:/var/www/ojs-data
      # OJS code plus custom themes, edited templates and public files.
      # Seeded from the image on first start; after that the volume wins.
      # Upgrading is manual: see README "Upgrading".
      - ojs-code:/var/www/html
      # - ./config.inc.php:/var/www/html/config.inc.php:ro
    tmpfs:
      - /var/lib/php/sessions:rw,noexec,nosuid,size=32m,mode=1733
    mem_limit: 768m
    mem_reservation: 384m
    mem_swappiness: 10
    cpuset: "0-5"
    cpus: "0.5"
    cpu_shares: 256
    pids_limit: 128
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Supervisor needs up to 15s to stop Apache gracefully.
    stop_grace_period: 40s
    blkio_config:
      # Requires Docker >= 25 on cgroup v2 (mapped to io.weight).
      weight: 200
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/healthz.txt"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Drop the ability to gain privileges through setuid binaries. Apache only
    # ever lowers privileges (root -> www-data), so this is safe.
    security_opt:
      - no-new-privileges:true
    networks:
      - ojs-net

networks:
  ojs-net:
    external: true

volumes:
  ojs-files:
  ojs-code:
