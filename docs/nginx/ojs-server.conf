# One server block per OJS instance.
#
# Template: replace ojs.example.org and 8081 with the journal's domain and the
# loopback port published by its tier compose file.
#
#   ojs-cache-zone.conf    -> /etc/nginx/conf.d/        (http context)
#   ojs-cache-location.inc -> /etc/nginx/snippets/      (included below)
#   this file              -> /etc/nginx/sites-available/ojs-j1.conf
#
# URL styles supported (both at the same time):
#   restful_urls = On   ->  /journal1, /journal1/article/view/123
#   restful_urls = Off  ->  /index.php/journal1, /index.php/journal1/article/view/123
#
# Verify after editing:  nginx -t && systemctl reload nginx

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ojs.example.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ojs.example.org;

    ssl_certificate     /etc/letsencrypt/live/ojs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ojs.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # OJS default upload limit in this image is 64M (upload_max_filesize).
    client_max_body_size 80m;

    # Applies to locations that do not declare their own headers (login, admin,
    # user pages). Cached locations repeat it because add_header does not merge.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/ojs-j1.access.log ojs;
    error_log  /var/log/nginx/ojs-j1.error.log warn;

    # Inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ---------------------------------------------------------------------
    # Site landing page (base_url) — usually the single busiest URL.
    # Exact match wins over every regex location below.
    # ---------------------------------------------------------------------
    location = / {
        proxy_pass http://127.0.0.1:8081;
        proxy_cache_valid 200 60s;
        include /etc/nginx/snippets/ojs-cache-location.inc;
    }

    location = /index.php {
        proxy_pass http://127.0.0.1:8081;
        proxy_cache_valid 200 60s;
        include /etc/nginx/snippets/ojs-cache-location.inc;
    }

    # ---------------------------------------------------------------------
    # Everything else: never cached (login, user, submission, admin, api,
    # article/download, install, gateway, $$$call$$$, ...).
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8081;
    }

    # ---------------------------------------------------------------------
    # Authentication endpoints: never cached, rate limited per client IP.
    # OJS posts to /<context>/login/signIn, /<context>/user/register and
    # /<context>/user/lostPassword (with or without the index.php/ prefix).
    # ---------------------------------------------------------------------
    location ~ ^/(?:index\.php/)?[^/.]+/(?:login(?:/|$)|user/(?:register|lostPassword)) {
        limit_req zone=ojs_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    # ---------------------------------------------------------------------
    # Web installer. Uncomment only AFTER the site is installed: leaving it
    # enabled blocks a fresh installation, leaving it reachable is a needless
    # attack surface.
    # ---------------------------------------------------------------------
    # location ~ ^/(?:index\.php/)?index/install {
    #     return 404;
    # }

    # ---------------------------------------------------------------------
    # Journal home: /journal1, /index.php/journal1, /index.php/index
    # [^/.]+ keeps single-segment files such as /favicon.ico and /robots.txt
    # out of this rule.
    # ---------------------------------------------------------------------
    location ~ ^/(?:index\.php/)?[^/.]+/?$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_cache_valid 200 60s;
        include /etc/nginx/snippets/ojs-cache-location.inc;
    }

    # ---------------------------------------------------------------------
    # Content pages, mirroring PKP's getCacheablePages() list.
    # ---------------------------------------------------------------------
    location ~ ^/(?:index\.php/)?[^/.]+/(?:issue/(?:view|archive)|article/view|about|help|information|announcement|index)(?:/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_cache_valid 200 60s;
        include /etc/nginx/snippets/ojs-cache-location.inc;
    }

    # ---------------------------------------------------------------------
    # Dynamically compiled CSS (and JS) served by PageHandler::css().
    # Not a static file: every request otherwise boots OJS, opens a DB
    # connection and writes the session row. Two of these fire per page view.
    #
    # 24h TTL: the output only changes when the active theme changes, so a
    # theme/plugin upgrade MUST purge this cache:
    #   find /var/cache/nginx/ojs -type f -delete
    # ---------------------------------------------------------------------
    location ~ /page/page/(?:css|js)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_cache_valid 200 24h;
        include /etc/nginx/snippets/ojs-cache-location.inc;
    }

    # ---------------------------------------------------------------------
    # Static assets: biggest request-count win, cached for a week.
    # Purge this cache after upgrading OJS or installing plugins.
    # ---------------------------------------------------------------------
    location ~* ^/(?:plugins|public|styles|js|lib/pkp)/.+\.(?:css|js|png|jpe?g|gif|svg|webp|woff2?|ttf|eot|ico)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_cache $ojs_cache_zone;
        proxy_cache_key "$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Liveness probe: never cached, never logged.
    location = /healthz.txt {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
    }
}