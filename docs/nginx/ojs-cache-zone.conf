# nginx cache zone for OJS — HTTP context only.
#
# Place at /etc/nginx/conf.d/ojs-cache-zone.conf (loaded inside http {}).
# One shared zone serves all journals: the cache key includes $host, so
# tenants never see each other's pages.

proxy_cache_path /var/cache/nginx/ojs
                 levels=1:2
                 keys_zone=ojs:128m
                 max_size=8g
                 inactive=1h
                 use_temp_path=off;

# Default zone for every journal. To isolate one tenant, add its own
# proxy_cache_path above and one line here; nothing else has to change:
#
#   proxy_cache_path /var/cache/nginx/ojs-j1 levels=1:2 keys_zone=ojs_j1:16m
#                    max_size=512m inactive=1h use_temp_path=off;
#
#   map $host $ojs_cache_zone {
#       default              ojs;
#       journal1.example.org ojs_j1;
#   }
map $host $ojs_cache_zone {
    default ojs;
}

# Requests carrying an OJS session cookie (OJSSID) are authenticated or at
# least session-bearing: never serve them from cache and never store them.
map $http_cookie $ojs_bypass {
    default 0;
    "~*OJSSID=" 1;
}

# Targeted cache refresh without extra modules (nginx Plus or ngx_cache_purge).
#
# Only an operator on the nginx host itself can force a backend fetch; the
# header is ignored for everybody else. The response is stored again, so:
#
#   curl -H 'X-OJS-Cache-Refresh: 1' https://ojs.example.org/journal1/article/view/123
#
# refreshes that single URL instead of wiping the whole zone.
geo $ojs_admin {
    default 0;
    127.0.0.1/32 1;
    ::1/128      1;
}

map "$ojs_admin:$http_x_ojs_cache_refresh" $ojs_refresh {
    default 0;
    "1:1"   1;
}

# Brute-force protection for authentication endpoints.
# The key includes $host so an attacker hammering one journal cannot lock users
# out of another journal served by the same nginx.
limit_req_zone "$host$binary_remote_addr" zone=ojs_auth:10m rate=10r/m;
limit_req_status 429;

# Access log with the two numbers that matter for capacity work:
# cache status and response time (rt = total, urt = backend).
log_format ojs '$host $remote_addr - [$time_local] "$request" $status '
               '$body_bytes_sent cache=$upstream_cache_status '
               'rt=$request_time urt=$upstream_response_time '
               '"$http_referer" "$http_user_agent"';

# Which OJS pages are safe to cache is decided by the explicit locations in
# ojs-server.conf, not by a blanket $uri match. The list mirrors PKP's own
# definition in classes/core/PageRouter.php::getCacheablePages():
#   '', 'index', 'about', 'announcement', 'help', 'information', 'issue'
#
# NEVER cache: login, user, submission, admin, api/v1, install, gateway/*,
#              $$$call$$$ (except page/page/css), article/download
#              (subscription-gated files).